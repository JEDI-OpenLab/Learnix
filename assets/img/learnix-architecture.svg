<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Architecture de principe de Learnix</title>
  <desc id="arch-desc">Chaîne RAG : l'utilisateur pose une question via l'interface privée (Telegram ou web) ; AnythingLLM, le workspace Learnix, récupère des extraits du corpus indexé dans la base vectorielle, envoie un prompt enrichi au modèle mistral-small-4-119b, et renvoie une réponse fondée sur les seuls documents — ou un refus explicite.</desc>
  <defs>
    <marker id="ar-blue" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,7 L9,3.5 z" fill="#315f8d"/></marker>
    <marker id="ar-teal" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,7 L9,3.5 z" fill="#1f7a78"/></marker>
    <marker id="ar-coral" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,7 L9,3.5 z" fill="#c85f4a"/></marker>
    <filter id="ar-shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#172a3a" flood-opacity=".12"/>
    </filter>
    <style>
      .ar-title { font: 700 30px Georgia, "Times New Roman", serif; fill: #172a3a; }
      .ar-sub { font: 400 16px Arial, sans-serif; fill: #5b6872; }
      .ar-zone { font: 700 14px Arial, sans-serif; letter-spacing: .08em; }
      .ar-box-title { font: 700 21px Arial, sans-serif; fill: #172a3a; }
      .ar-box-text { font: 400 15.5px Arial, sans-serif; fill: #4f5b66; }
      .ar-flow { font: 700 13px Arial, sans-serif; }
      .ar-legend { font: 400 15px Arial, sans-serif; fill: #5b6872; }
      .ar-icon { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="760" rx="28" fill="#f7f6f1"/>
  <text x="640" y="54" text-anchor="middle" class="ar-title">Learnix : architecture de principe</text>
  <text x="640" y="84" text-anchor="middle" class="ar-sub">Une chaîne RAG : la question rencontre un corpus indexé, et le modèle répond à partir des seuls documents.</text>

  <!-- Zones -->
  <text x="56" y="128" class="ar-zone" fill="#315f8d">INTERFACE</text>
  <text x="536" y="128" class="ar-zone" fill="#1f7a78">MOTEUR RAG</text>
  <text x="856" y="128" class="ar-zone" fill="#c85f4a">MODÈLE &amp; RÉPONSE</text>

  <!-- Boîtes -->
  <g filter="url(#ar-shadow)">
    <rect x="56" y="150" width="216" height="146" rx="12" fill="#dce8f3" stroke="#315f8d" stroke-width="3"/>
    <rect x="296" y="150" width="216" height="146" rx="12" fill="#dce8f3" stroke="#315f8d" stroke-width="3"/>
    <rect x="536" y="150" width="288" height="146" rx="12" fill="#dcebe2" stroke="#1f7a78" stroke-width="3"/>
    <rect x="856" y="150" width="232" height="146" rx="12" fill="#f2ded8" stroke="#c85f4a" stroke-width="3"/>
    <rect x="296" y="442" width="216" height="146" rx="12" fill="#fff5dd" stroke="#d49a26" stroke-width="3"/>
    <rect x="536" y="442" width="288" height="146" rx="12" fill="#eef1f4" stroke="#5b6872" stroke-width="3"/>
    <rect x="856" y="442" width="232" height="146" rx="12" fill="#dcebe2" stroke="#1f7a78" stroke-width="3"/>
  </g>

  <!-- Icônes -->
  <g class="ar-icon" stroke="#315f8d"><circle cx="164" cy="184" r="6"/><path d="M153 202 a11 11 0 0 1 22 0"/></g>
  <g class="ar-icon" stroke="#315f8d"><path d="M415 178 L393 186 L401 189 Z"/><path d="M415 178 L401 189 L401 197 L406 192"/></g>
  <g class="ar-icon" stroke="#1f7a78"><path d="M680 178 L700 186 L680 194 L660 186 Z"/><path d="M660 192 L680 200 L700 192"/></g>
  <g class="ar-icon" stroke="#c85f4a"><rect x="964" y="176" width="16" height="16" rx="2"/><rect x="969" y="181" width="6" height="6"/><line x1="968" y1="176" x2="968" y2="172"/><line x1="976" y1="176" x2="976" y2="172"/><line x1="968" y1="192" x2="968" y2="196"/><line x1="976" y1="192" x2="976" y2="196"/></g>
  <g class="ar-icon" stroke="#d49a26"><rect x="394" y="470" width="20" height="26" rx="2"/><line x1="399" y1="478" x2="409" y2="478"/><line x1="399" y1="484" x2="409" y2="484"/><line x1="399" y1="490" x2="406" y2="490"/></g>
  <g stroke="#5b6872" fill="#5b6872"><circle cx="672" cy="476" r="1.7"/><circle cx="680" cy="476" r="1.7"/><circle cx="688" cy="476" r="1.7"/><circle cx="672" cy="484" r="1.7"/><circle cx="680" cy="484" r="1.7"/><circle cx="688" cy="484" r="1.7"/><circle cx="672" cy="492" r="1.7"/><circle cx="680" cy="492" r="1.7"/><circle cx="688" cy="492" r="1.7"/></g>
  <g class="ar-icon" stroke="#1f7a78"><path d="M961 470 h22 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-14 l-6 5 v-5 h-2 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 z"/></g>

  <!-- Textes -->
  <text x="164" y="226" text-anchor="middle" class="ar-box-title">Utilisateur</text>
  <text x="164" y="254" text-anchor="middle" class="ar-box-text">pose une question</text>

  <text x="404" y="226" text-anchor="middle" class="ar-box-title">Interface</text>
  <text x="404" y="252" text-anchor="middle" class="ar-box-text">Telegram ou web</text>
  <text x="404" y="274" text-anchor="middle" class="ar-box-text">privée</text>

  <text x="680" y="224" text-anchor="middle" class="ar-box-title">AnythingLLM</text>
  <text x="680" y="250" text-anchor="middle" class="ar-box-text">workspace Learnix · RAG</text>
  <text x="680" y="272" text-anchor="middle" class="ar-box-text">mode Requête · invite stricte</text>

  <text x="972" y="226" text-anchor="middle" class="ar-box-title">Modèle</text>
  <text x="972" y="252" text-anchor="middle" class="ar-box-text">mistral-small-4-119b</text>
  <text x="972" y="274" text-anchor="middle" class="ar-box-text">API distante</text>

  <text x="404" y="518" text-anchor="middle" class="ar-box-title">Corpus</text>
  <text x="404" y="544" text-anchor="middle" class="ar-box-text">PDF, DOCX, pages web</text>
  <text x="404" y="566" text-anchor="middle" class="ar-box-text">documents choisis</text>

  <text x="680" y="518" text-anchor="middle" class="ar-box-title">Base vectorielle</text>
  <text x="680" y="544" text-anchor="middle" class="ar-box-text">fragments indexés</text>
  <text x="680" y="566" text-anchor="middle" class="ar-box-text">recherche de contexte</text>

  <text x="972" y="518" text-anchor="middle" class="ar-box-title">Réponse</text>
  <text x="972" y="544" text-anchor="middle" class="ar-box-text">à partir du corpus</text>
  <text x="972" y="566" text-anchor="middle" class="ar-box-text">ou refus explicite</text>

  <!-- Flèches : interface (bleu) -->
  <path d="M272 223 H292" fill="none" stroke="#315f8d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar-blue)"/>
  <path d="M512 223 H532" fill="none" stroke="#315f8d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar-blue)"/>

  <!-- moteur -> modèle (coral) -->
  <path d="M824 212 H852" fill="none" stroke="#c85f4a" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar-coral)"/>
  <!-- modèle -> réponse (coral, V) -->
  <path d="M972 296 V438" fill="none" stroke="#c85f4a" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar-coral)"/>
  <text x="986" y="372" text-anchor="start" class="ar-flow" fill="#b04531">génération</text>

  <!-- corpus -> base vectorielle (teal) -->
  <path d="M512 515 H532" fill="none" stroke="#1f7a78" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar-teal)"/>
  <!-- base vectorielle -> moteur (teal, V up) -->
  <path d="M680 442 V300" fill="none" stroke="#1f7a78" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ar-teal)"/>
  <text x="694" y="372" text-anchor="start" class="ar-flow" fill="#1f7a78">contexte</text>

  <!-- réponse -> utilisateur (teal, coude par le bas) -->
  <path d="M972 588 V632 H164 V300" fill="none" stroke="#1f7a78" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-teal)"/>
  <text x="568" y="622" text-anchor="middle" class="ar-flow" fill="#1f7a78">réponse renvoyée à l'utilisateur</text>

  <!-- Légende -->
  <line x1="56" y1="676" x2="88" y2="676" stroke="#315f8d" stroke-width="5" stroke-linecap="round"/>
  <text x="96" y="681" class="ar-legend">Question de l'utilisateur, via l'interface privée.</text>
  <line x1="56" y1="704" x2="88" y2="704" stroke="#1f7a78" stroke-width="5" stroke-linecap="round"/>
  <text x="96" y="709" class="ar-legend">Récupération dans le corpus indexé (RAG), puis réponse renvoyée.</text>
  <line x1="56" y1="732" x2="88" y2="732" stroke="#c85f4a" stroke-width="5" stroke-linecap="round"/>
  <text x="96" y="737" class="ar-legend">Génération par le modèle, à partir du seul contexte fourni.</text>
</svg>
