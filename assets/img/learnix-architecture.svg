<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Learnix</title>
  <desc id="desc">Schéma montrant le parcours utilisateur par Telegram, AnythingLLM, le corpus indexé, la base vectorielle, l'appel au modèle et le retour de réponse via Telegram.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#315f8d"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#172a3a" flood-opacity=".15"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #172a3a; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #172a3a; }
      .box-text { font: 18px Arial, sans-serif; fill: #5b6872; }
      .caption { font: 700 16px Arial, sans-serif; fill: #315f8d; }
      .small { font: 16px Arial, sans-serif; fill: #5b6872; }
      .label { font: 700 15px Arial, sans-serif; fill: #315f8d; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#f7f6f1"/>
  <text x="600" y="62" text-anchor="middle" class="title">Learnix : architecture de principe</text>

  <g filter="url(#shadow)">
    <rect x="50" y="160" width="180" height="128" rx="10" fill="#dce8f3" stroke="#315f8d" stroke-width="3"/>
    <text x="140" y="205" text-anchor="middle" class="box-title">Utilisateur</text>
    <text x="140" y="240" text-anchor="middle" class="box-text">question</text>
    <text x="140" y="266" text-anchor="middle" class="box-text">pédagogique</text>

    <rect x="280" y="145" width="210" height="158" rx="10" fill="#e7eff8" stroke="#315f8d" stroke-width="3"/>
    <text x="385" y="190" text-anchor="middle" class="box-title">Telegram</text>
    <text x="385" y="227" text-anchor="middle" class="box-text">bot privé</text>
    <text x="385" y="255" text-anchor="middle" class="box-text">interface</text>
    <text x="385" y="283" text-anchor="middle" class="box-text">utilisateur</text>

    <rect x="560" y="120" width="270" height="205" rx="10" fill="#dcebe2" stroke="#1f7a78" stroke-width="3"/>
    <text x="695" y="170" text-anchor="middle" class="box-title">AnythingLLM</text>
    <text x="695" y="207" text-anchor="middle" class="box-text">workspace Learnix</text>
    <text x="695" y="235" text-anchor="middle" class="box-text">mode Requête</text>
    <text x="695" y="263" text-anchor="middle" class="box-text">invite stricte</text>
    <text x="695" y="291" text-anchor="middle" class="box-text">RAG</text>

    <rect x="925" y="160" width="220" height="128" rx="10" fill="#f2ded8" stroke="#c85f4a" stroke-width="3"/>
    <text x="1035" y="205" text-anchor="middle" class="box-title">Modèle</text>
    <text x="1035" y="240" text-anchor="middle" class="box-text">API distante</text>
    <text x="1035" y="266" text-anchor="middle" class="box-text">ou modèle local</text>

    <rect x="95" y="455" width="265" height="150" rx="10" fill="#fff5dd" stroke="#d49a26" stroke-width="3"/>
    <text x="228" y="503" text-anchor="middle" class="box-title">Corpus</text>
    <text x="228" y="541" text-anchor="middle" class="box-text">PDF, DOCX, pages web</text>
    <text x="228" y="569" text-anchor="middle" class="box-text">documents sélectionnés</text>

    <rect x="465" y="455" width="270" height="150" rx="10" fill="#eef1f4" stroke="#5b6872" stroke-width="3"/>
    <text x="600" y="503" text-anchor="middle" class="box-title">Base vectorielle</text>
    <text x="600" y="541" text-anchor="middle" class="box-text">fragments indexés</text>
    <text x="600" y="569" text-anchor="middle" class="box-text">recherche de contexte</text>

    <rect x="820" y="455" width="280" height="150" rx="10" fill="#dcebe2" stroke="#1f7a78" stroke-width="3"/>
    <text x="960" y="503" text-anchor="middle" class="box-title">Réponse</text>
    <text x="960" y="541" text-anchor="middle" class="box-text">à partir du corpus</text>
    <text x="960" y="569" text-anchor="middle" class="box-text">ou refus explicite</text>
  </g>

  <g fill="none" stroke="#315f8d" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M230 224 H270"/>
    <path d="M490 224 H550"/>
    <path d="M830 224 H915"/>
    <path d="M1035 288 C1035 365 1000 410 970 445"/>
    <path d="M360 530 H455"/>
    <path d="M600 455 C610 390 640 355 665 328"/>
    <path d="M820 585 C650 690 390 680 385 313"/>
    <path d="M280 278 C230 340 160 340 140 298"/>
  </g>

  <g>
    <text x="300" y="688" text-anchor="middle" class="label">réponse via Telegram</text>
    <text x="600" y="705" text-anchor="middle" class="small">Telegram est l'interface privée : il transmet la question à AnythingLLM et renvoie la réponse à l'utilisateur.</text>
  </g>
</svg>
