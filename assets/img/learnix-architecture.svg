<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Learnix</title>
  <desc id="desc">Schéma montrant les interfaces privées, AnythingLLM, le corpus indexé, la base vectorielle, l'appel au modèle et la réponse encadrée.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#315f8d"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#172a3a" flood-opacity=".15"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #172a3a; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #172a3a; }
      .box-text { font: 18px Arial, sans-serif; fill: #5b6872; }
      .caption { font: 700 16px Arial, sans-serif; fill: #315f8d; }
      .small { font: 16px Arial, sans-serif; fill: #5b6872; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#f7f6f1"/>
  <text x="600" y="62" text-anchor="middle" class="title">Learnix : architecture de principe</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="220" height="130" rx="10" fill="#dce8f3" stroke="#315f8d" stroke-width="3"/>
    <text x="180" y="195" text-anchor="middle" class="box-title">Utilisateur</text>
    <text x="180" y="230" text-anchor="middle" class="box-text">question</text>
    <text x="180" y="256" text-anchor="middle" class="box-text">pédagogique</text>

    <rect x="380" y="120" width="260" height="190" rx="10" fill="#dcebe2" stroke="#1f7a78" stroke-width="3"/>
    <text x="510" y="170" text-anchor="middle" class="box-title">AnythingLLM</text>
    <text x="510" y="207" text-anchor="middle" class="box-text">workspace Learnix</text>
    <text x="510" y="235" text-anchor="middle" class="box-text">mode Requête</text>
    <text x="510" y="263" text-anchor="middle" class="box-text">invite stricte</text>

    <rect x="805" y="150" width="250" height="130" rx="10" fill="#f2ded8" stroke="#c85f4a" stroke-width="3"/>
    <text x="930" y="195" text-anchor="middle" class="box-title">Modèle</text>
    <text x="930" y="230" text-anchor="middle" class="box-text">API distante</text>
    <text x="930" y="256" text-anchor="middle" class="box-text">ou modèle local</text>

    <rect x="120" y="450" width="260" height="150" rx="10" fill="#fff5dd" stroke="#d49a26" stroke-width="3"/>
    <text x="250" y="498" text-anchor="middle" class="box-title">Corpus</text>
    <text x="250" y="536" text-anchor="middle" class="box-text">PDF, DOCX, pages web</text>
    <text x="250" y="564" text-anchor="middle" class="box-text">documents sélectionnés</text>

    <rect x="470" y="450" width="260" height="150" rx="10" fill="#eef1f4" stroke="#5b6872" stroke-width="3"/>
    <text x="600" y="498" text-anchor="middle" class="box-title">Base vectorielle</text>
    <text x="600" y="536" text-anchor="middle" class="box-text">fragments indexés</text>
    <text x="600" y="564" text-anchor="middle" class="box-text">recherche de contexte</text>

    <rect x="820" y="450" width="260" height="150" rx="10" fill="#dcebe2" stroke="#1f7a78" stroke-width="3"/>
    <text x="950" y="498" text-anchor="middle" class="box-title">Réponse</text>
    <text x="950" y="536" text-anchor="middle" class="box-text">à partir du corpus</text>
    <text x="950" y="564" text-anchor="middle" class="box-text">ou refus explicite</text>
  </g>

  <g fill="none" stroke="#315f8d" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M290 215 H370"/>
    <path d="M640 215 H795"/>
    <path d="M930 280 C930 360 930 390 950 440"/>
    <path d="M820 525 H740"/>
    <path d="M470 525 H390"/>
    <path d="M250 450 C290 360 390 340 480 318"/>
    <path d="M820 590 C640 690 305 690 190 285"/>
  </g>

  <g>
    <text x="540" y="690" text-anchor="middle" class="small">La réponse revient à l’utilisateur sans ouvrir le chatbot au public.</text>
  </g>
</svg>
